name: Build Unsigned IPA for Scarlet

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App Bundle
        run: |
          xcodebuild -project ExamPCalc.xcodeproj \
            -scheme ExamPCalc \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ExamPCalc.app Payload/
          zip -qry ExamPCalc.ipa Payload

      - name: Upload ExamPCalc.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamPCalc-Scarlet-IPA
          path: ExamPCalc.ipa
