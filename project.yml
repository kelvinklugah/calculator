name: ExamPCalc
options:
  bundleIdPrefix: com.actuarial
  deploymentTarget:
    iOS: "15.0"
targets:
  ExamPCalc:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: App
        type: folder
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.actuarial.exampcalc
        PRODUCT_NAME: ExamPCalc
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
